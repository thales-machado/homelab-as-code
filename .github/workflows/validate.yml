name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install yamllint==1.35.1
      - run: yamllint -c .yamllint.yml -f github .

  compose:
    runs-on: ubuntu-latest
    env:
      # Hosts run Compose v5: v2 rejects the host override files pulled in through include:.
      COMPOSE_VERSION: v5.1.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Docker Compose ${{ env.COMPOSE_VERSION }}
        run: |
          curl -fsSL -o /usr/local/bin/compose \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          chmod +x /usr/local/bin/compose
      - name: Render every host entry point
        run: |
          set -euo pipefail
          for f in hosts/*/compose.yaml hosts/*/komodo-*.yaml; do
            [ -f "$f" ] || continue
            grep -q '^include:' "$f" || continue
            dir=$(dirname "$f")
            echo "::group::$f"
            (cd "$dir" && HOMELAB_ENV="$PWD/.env.example" compose --env-file .env.example -f "$(basename "$f")" config -q)
            echo "::endgroup::"
          done

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: find scripts infra -name '*.sh' -print0 | xargs -0 shellcheck -S warning

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive terraform
