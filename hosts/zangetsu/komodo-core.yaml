# Separate Compose project on purpose: komodo-core (plus its ferretdb/postgres
# backend) must NEVER live in the same Compose project ("homelab") as the
# homelab-zangetsu Stack that Komodo itself manages. Same reason and real
# incident as komodo-periphery.yaml (see the comment there): a force_deploy
# DeployStack recreates the whole stack without a diff, and if Core is inside
# that stack it kills itself midway (actual log: "Komodo shutdown during
# execution"). That orphans the deploy's own record (Update stays
# "Complete"/success:false forever, and the Stack shows DOWN even though all
# containers are actually healthy).
#
# The network is referenced as external: true (already created by the main
# compose.yaml). Do not duplicate the network definition here.
#
# Manual deploy/update: cd hosts/zangetsu && docker compose -f komodo-core.yaml up -d
# (never via Komodo/webhook: it is deliberately in no include:, and must never
# be passed with -f together with compose.yaml).
name: komodo-core

networks:
  cloudflare-net:
    external: true

include:
  - ../../infra/platform/management/komodo/komodo.yaml
