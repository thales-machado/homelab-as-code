name: sqlite-backup-urahara
description: Daily consistent backup of urahara's app SQLite databases (e.g. Home Assistant) - runs on zangetsu, executes remotely on urahara via SSH (same pattern as restic-backup-urahara)

schedule: "CRON_TZ=America/Sao_Paulo 20 2 * * *"

steps:
  - name: backup
    retry_policy:
      limit: 3
      interval_sec: 900
    action: ssh.run
    with:
      user: admin
      host: 192.168.10.215
      port: 22
      key: /opt/homelab-ssh/id_ed25519
      known_host_file: /opt/homelab-ssh/known_hosts
      strict_host_key: true
      # Explicit shell - same quirk as restic-backup-urahara.yaml: without it
      # Dagu unescapes \$ before sending over SSH.
      shell: /bin/sh
      command: >-
        docker run --rm
        -v /opt/homelab/scripts:/opt/homelab/scripts:ro
        -v /opt/apps/home-assistant/config:/opt/apps/home-assistant/config
        -v /opt/apps/trilium:/opt/apps/trilium
        -v /opt/apps/crowdsec/data:/opt/apps/crowdsec/data
        -v /opt/apps/vikunja/db:/opt/apps/vikunja/db
        --network cloudflare-net
        alpine:3
        sh -c "apk add --no-cache --quiet sqlite && sh /opt/homelab/scripts/backup/backup-sqlite-urahara.sh && wget -q -O /dev/null http://192.168.10.214:8000/ping/00000000-0000-0000-0000-000000000000 || { wget -q -O /dev/null http://192.168.10.214:8000/ping/00000000-0000-0000-0000-000000000000/fail; exit 1; }"
