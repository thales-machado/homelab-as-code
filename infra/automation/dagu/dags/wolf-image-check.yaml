name: wolf-image-check
description: Monthly check of the Wolf stack's pinned digests (wolf, wolf-ui, retroarch, es-de) against GHCR - only notifies via Healthchecks, never updates anything

schedule: "CRON_TZ=America/Sao_Paulo 0 9 1 * *"

steps:
  - name: check
    retry_policy:
      limit: 3
      interval_sec: 900
    action: docker.run
    with:
      image: alpine:3
      pull: missing
      auto_remove: true
      network:
        EndpointsConfig:
          cloudflare-net: {}
      volumes:
        - /opt/homelab:/opt/homelab:ro
      command: sh -c "apk add --no-cache --quiet curl jq && sh /opt/homelab/scripts/monitoring/check-wolf-image-updates.sh"
