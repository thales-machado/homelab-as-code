services:
  nebula-sync:
    image: ghcr.io/lovelaze/nebula-sync:latest
    container_name: nebula-sync
    restart: unless-stopped
    cpus: 0.20
    mem_limit: 128m
    pids_limit: 32
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
      - "PRIMARY=http://pi-hole|${ADMIN_PASSWORD}"
      - "REPLICAS=http://192.168.10.215|${ADMIN_PASSWORD}"
      - CRON=0 */6 * * *
      - FULL_SYNC=true
      - RUN_GRAVITY=true
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks:
      - cloudflare-net
