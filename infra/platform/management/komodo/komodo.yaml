# Komodo: multi-host Docker management. Backend is Postgres+FerretDB (Mongo
# wire-protocol adapter over Postgres, https://www.ferretdb.com) instead of
# plain MongoDB: reuses the existing postgres-exporter and backup-postgres.sh
# and avoids adding a new database engine just for this service.
# Runs only on zangetsu (central Core). Periphery agents run on each managed
# host - see periphery.yaml (host-agnostic, also included on urahara).
services:
  komodo-postgres:
    # 🚨 Explicit version pin: updates can break the DocumentDB extension.
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
    container_name: komodo-postgres
    restart: unless-stopped
    cpus: 0.30
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - /opt/apps/komodo/postgres-data:/var/lib/postgresql/data
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=postgres
    labels:
      # Keeps Komodo from stopping/managing its own database (StopAllContainers)
      komodo.skip: ""
    networks:
      - cloudflare-net

  komodo-ferretdb:
    # 🚨 Explicit version pin: updates can break compatibility with Core.
    image: ghcr.io/ferretdb/ferretdb:2.7.0
    container_name: komodo-ferretdb
    restart: unless-stopped
    cpus: 0.30
    mem_limit: 256m
    pids_limit: 64
    depends_on:
      komodo-postgres:
        condition: service_healthy
    volumes:
      - /opt/apps/komodo/ferretdb-state:/state
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
      - FERRETDB_POSTGRESQL_URL=postgres://${DB_USER}:${DB_PASSWORD}@komodo-postgres:5432/postgres
    labels:
      komodo.skip: ""
    networks:
      - cloudflare-net

  komodo-core:
    image: ghcr.io/moghtech/komodo-core:2
    container_name: komodo-core
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 512m
    pids_limit: 128
    depends_on:
      - komodo-ferretdb
    # komodo-core runs in a separate Compose project (hosts/zangetsu/komodo-core.yaml,
    # see comment there). Cross-project depends_on doesn't work in Compose, so
    # dockflare was removed from here (it was only start order; dockflare is
    # already up long before core actually needs it).
    # Published on the LAN so the remote Periphery on urahara can reach Core
    # (same exception already documented for DockFlare, port 5000 for the
    # remote agent).
    ports:
      - "192.168.10.214:9120:9120"
    # Real quirk (Komodo v2.3.2): DeployStackIfChanged hangs forever (no
    # error, no log, no persisted update, never reaches Periphery) even with
    # clone/credentials working. Hang confirmed specifically in
    # RefreshStackCache/DeployStackIfChanged, apparently tied to a native
    # git-clone Stack with an `include:`-heavy compose.yaml (many files to
    # resolve in the diff); not seen on a stack with a single compose.yaml
    # and no include:. Plain DeployStack (forces a full deploy) works end to end.
    # So homelab-urahara uses webhook_force_deploy: true (Stack config in
    # Komodo, not in this yaml). Re-evaluate once Watchtower updates Core past
    # 2.3.2 (see watchtower label below); don't revert before confirming in a
    # test that the bug is gone.
    volumes:
      - /opt/apps/komodo/keys:/config/keys
      - /opt/apps/komodo/backups:/backups
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
      - KOMODO_DATABASE_ADDRESS=komodo-ferretdb:27017
      - KOMODO_DATABASE_USERNAME=${DB_USER}
      - KOMODO_DATABASE_PASSWORD=${DB_PASSWORD}
      - KOMODO_HOST=https://komodo.lan.example.com
      - KOMODO_LOCAL_AUTH=true
      - KOMODO_INIT_ADMIN_USERNAME=${ADMIN_USER}
      - KOMODO_INIT_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - KOMODO_JWT_SECRET=${KOMODO_JWT_SECRET}
      - KOMODO_WEBHOOK_SECRET=${KOMODO_WEBHOOK_SECRET}
      - KOMODO_PASSKEY=${KOMODO_PASSKEY}
      # Default is 1-hr, too slow for the dashboard to reflect new/removed
      # containers. CPU/mem stats are already fast by default
      # (monitoring_interval, not changed here).
      - KOMODO_RESOURCE_POLL_INTERVAL=5-min
    labels:
      # Floating tag (:2): standard auto-update opt-in (see the Docker image
      # policy in CONVENTIONS.md). Careful with upgrades: Komodo v2.3.2 has a known
      # DeployStackIfChanged bug (see comment above volumes:). After each
      # automatic update, check release notes/CHANGELOG to see whether that
      # workaround is still needed.
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.http.routers.komodo.rule: "Host(`komodo.lan.example.com`)"
      traefik.http.routers.komodo.entrypoints: "websecure"
      traefik.http.routers.komodo.tls.certresolver: "cloudflare"
      traefik.http.routers.komodo.middlewares: "crowdsec@file,security-headers@file"
      traefik.http.services.komodo.loadbalancer.server.port: "9120"
      # Public so it can receive GitHub webhooks (Komodo Stack in native
      # git-clone mode). GitHub can't reach
      # *.lan.example.com (split-horizon, resolves only on the internal LAN).
      dockflare.enable: "true"
      dockflare.hostname: "komodo.example.com"
      dockflare.service: "http://komodo-core:9120"
      dockflare.access.group: "homelab-admin"
      # Webhook listener bypasses Access (GitHub can't complete the MFA flow).
      # Authenticity is validated by Komodo itself via HMAC signature
      # (Webhook Secret), not by Cloudflare Access.
      dockflare.0.hostname: "komodo.example.com"
      dockflare.0.path: "/listener"
      dockflare.0.service: "http://komodo-core:9120"
      dockflare.0.access.group: "public-default-bypass"
    networks:
      - cloudflare-net
