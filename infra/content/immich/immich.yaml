services:
  immich-redis:
    image: redis:7-alpine
    container_name: immich-redis
    restart: unless-stopped
    cpus: 0.20
    mem_limit: 64m
    pids_limit: 32
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    environment:
      - TZ=${TZ}
    networks:
      - cloudflare-net
    # Tag "7-alpine": no Watchtower label, never auto-updated
    # (deliberate, stateful component).

  immich-db:
    image: pgvector/pgvector:pg16
    container_name: immich-db
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d immich"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # 5433, not 5432 (already taken by paperless-db on this host).
    # Published so postgres-exporter and backup-postgres.sh (both on
    # zangetsu) can reach it cross-host.
    ports:
      - "192.168.10.215:5433:5432"
    volumes:
      - /opt/apps/immich/db:/var/lib/postgresql/data
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=immich
    networks:
      - cloudflare-net
    # Tag "pg16": no Watchtower label, never auto-updated
    # (deliberate, database).

  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich-server
    restart: unless-stopped
    cpus: 2.00
    mem_limit: 2560m
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2283/api/server/ping || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 120s
    # Published so Traefik (zangetsu) can reach the private route immich.lan.example.com
    ports:
      - "192.168.10.215:2283:2283"
    volumes:
      - /mnt/media/immich/upload:/usr/src/app/upload
      - /mnt/media/immich/external:/mnt/library:ro
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
      - REDIS_HOSTNAME=immich-redis
      - DB_HOSTNAME=immich-db
      - DB_USERNAME=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE_NAME=immich
      - DB_VECTOR_EXTENSION=pgvector
      - MACHINE_LEARNING_ENABLED=true
      - IMMICH_MACHINE_LEARNING_URL=http://immich-machine-learning:3003
    depends_on:
      immich-db:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
      immich-machine-learning:
        condition: service_started
      dockflare-agent:
        condition: service_started
    networks:
      - cloudflare-net
    labels:
      dockflare.enable: "true"
      dockflare.hostname: "immich.example.com"
      dockflare.service: "http://immich-server:2283"
      com.centurylinklabs.watchtower.enable: "true"

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich-machine-learning
    restart: unless-stopped
    cpus: 4.00
    mem_limit: 4096m
    pids_limit: 256
    volumes:
      - /opt/apps/immich/model-cache:/cache
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
    networks:
      - cloudflare-net
    labels:
      com.centurylinklabs.watchtower.enable: "true"
