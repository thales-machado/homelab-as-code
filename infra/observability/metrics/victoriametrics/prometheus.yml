global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "victoriametrics"
    static_configs:
      - targets: ["localhost:8428"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: zangetsu
      - targets: ["192.168.10.215:9100"]
        labels:
          host: urahara

  # Multi-target via /probe (auth_modules in postgres_exporter.yml, see
  # scripts/setup/setup-postgres-exporter-config.sh). DATA_SOURCE_NAME with
  # comma-separated DSNs does not work for multiple databases: the default
  # collectors (pg_stat_database etc.) only reflected the FIRST DSN, with no
  # "server" label. Same multi-target pattern as redis-exporter-urahara/
  # blackbox-exporter below (metrics_path /probe + relabel_configs).
  - job_name: "postgres-exporter"
    metrics_path: /probe
    static_configs:
      - targets: ["firefly-db:5432/firefly"]
        labels:
          auth_module: firefly
          server: firefly
      - targets: ["192.168.10.215:5432/paperless"]
        labels:
          auth_module: paperless
          server: paperless
      - targets: ["192.168.10.215:5433/immich"]
        labels:
          auth_module: immich
          server: immich
      - targets: ["192.168.10.215:5434/tandoor"]
        labels:
          auth_module: tandoor
          server: tandoor
      - targets: ["komodo-postgres:5432/postgres"]
        labels:
          auth_module: komodo
          server: komodo
      - targets: ["192.168.10.215:5435/evolution"]
        labels:
          auth_module: evolution
          server: evolution
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [auth_module]
        target_label: __param_auth_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: postgres-exporter:9187

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          host: zangetsu

  # No fixed REDIS_ADDR in the container (see redis-exporter-urahara.yaml):
  # redis_exporter multi-target pattern, same logic as blackbox-exporter below
  # (metrics_path /scrape + relabel_configs to build the real target).
  - job_name: "redis-exporter-urahara"
    metrics_path: /scrape
    static_configs:
      - targets:
          - redis://immich-redis:6379
          - redis://paperless-redis:6379
          - redis://evolution-redis:6379
        labels:
          host: urahara
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 192.168.10.215:9121

  - job_name: "smartctl-exporter"
    static_configs:
      - targets: ["smartctl-exporter:9902"]
        labels:
          host: zangetsu
      - targets: ["192.168.10.215:9902"]
        labels:
          host: urahara

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          host: zangetsu
      - targets: ["192.168.10.215:8081"]
        labels:
          host: urahara

  - job_name: "docker"
    static_configs:
      - targets: ["host.gateway:9323"]

  - job_name: "unpoller"
    static_configs:
      - targets: ["unpoller:9130"]

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

  - job_name: "traefik"
    static_configs:
      - targets: ["traefik:8080"]

  - job_name: "watchtower"
    metrics_path: /v1/metrics
    authorization:
      credentials_file: /etc/vm/secrets/watchtower-token
    static_configs:
      - targets: ["watchtower:8080"]

  - job_name: "rclone"
    metrics_path: /metrics
    basic_auth:
      username_file: /etc/vm/secrets/rclone-username
      password_file: /etc/vm/secrets/rclone-password
    static_configs:
      - targets: ["192.168.10.215:5572"]
        labels:
          host: urahara

  - job_name: "alloy"
    static_configs:
      - targets: ["grafana-alloy:12345"]

  - job_name: "crowdsec"
    static_configs:
      - targets: ["192.168.10.215:6060"]
        labels:
          host: urahara

  - job_name: "evolution-api"
    static_configs:
      - targets: ["192.168.10.215:8094"]
        labels:
          host: urahara

  - job_name: "blackbox-exporter"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://homepage.example.com
          - https://vaultwarden.example.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
