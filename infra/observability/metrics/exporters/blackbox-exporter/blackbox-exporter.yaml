services:
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    cpus: 0.20
    mem_limit: 64m
    pids_limit: 32
    volumes:
      - ./config/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
    networks:
      - cloudflare-net

