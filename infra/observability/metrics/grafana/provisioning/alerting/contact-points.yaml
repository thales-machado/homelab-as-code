apiVersion: 1

contactPoints:
    - orgId: 1
      name: whatsapp-homelab-alerts
      receivers:
        - uid: ffswege1dbkzkc
          type: webhook
          settings:
            url: http://192.168.10.215:8094/message/sendText/homelab
            httpMethod: POST
            authorization_scheme: ""
            headers:
                apikey: ${EVOLUTION_API_KEY}
            payload:
                template: |
                    {"number": "120363428567609395@g.us", "text": "{{ if eq .Status "firing" }}🚨 *ALERTA*{{ else }}✅ *RESOLVIDO*{{ end }}{{ range .Alerts }}\n*{{ if .Labels.host }}[{{ .Labels.host }}] - {{ end }}{{ .Labels.shortname }}*\n{{ .Annotations.summary }}{{ end }}"}
          disableResolveMessage: false
    - orgId: 1
      name: n8n-oom-autorestart
      receivers:
        - uid: ffswege1dbkzkd
          type: webhook
          settings:
            url: https://n8n.lan.example.com/webhook/homelab-notify
            httpMethod: POST
            authorization_scheme: ""
            headers:
                x-homelab-secret: ${N8N_WEBHOOK_SECRET}
          disableResolveMessage: true
