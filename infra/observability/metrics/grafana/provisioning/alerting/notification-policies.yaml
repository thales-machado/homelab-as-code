apiVersion: 1

policies:
    - orgId: 1
      receiver: whatsapp-homelab-alerts
      group_by:
        - alertname
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: n8n-oom-autorestart
          matchers:
            - shortname = OOM
          group_by:
            - alertname
            - name
            - host
          group_wait: 10s
          group_interval: 15m
          repeat_interval: 15m
