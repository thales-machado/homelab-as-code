services:
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 256m
    pids_limit: 64
    volumes:
      - /opt/apps/uptime-kuma:/app/data
    env_file:
      - ${HOMELAB_ENV}
    environment:
      - TZ=${TZ}
    depends_on:
      dockflare:
        condition: service_started
    networks:
      - cloudflare-net
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.http.routers.uptime-kuma.rule: "Host(`uptime-kuma.lan.example.com`)"
      traefik.http.routers.uptime-kuma.entrypoints: "websecure"
      traefik.http.routers.uptime-kuma.tls.certresolver: "cloudflare"
      traefik.http.routers.uptime-kuma.middlewares: "crowdsec@file,security-headers@file"
      traefik.http.services.uptime-kuma.loadbalancer.server.port: "3001"

